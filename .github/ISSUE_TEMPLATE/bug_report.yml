name: Bug report
description: Mibo does not start, crashes, or a feature fails
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a wrong reply or action, use **Reply or action report**. Never paste keys, tokens or real conversations.
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings › About, or `mibo --version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Windows installer
        - macOS app
        - Source
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Steps, result and expected result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The relevant lines of the terminal output, or of `runtime/desktop/app.log` in the home folder when Mibo runs without a terminal, with personal details removed.
      render: text
