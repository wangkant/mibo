name: Bug report
description: "Something does not work: it will not start, will not connect, crashes, or the setup fails"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.

        If the bot **said the wrong thing**, use the "Persona report" form instead.

        Never paste API keys, tokens or real chat logs. Black out QQ numbers and names.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `mibo --version`.
      placeholder: mibo 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - The Windows installer
        - The macOS app
        - git clone
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
      description: The steps you took, and where it went wrong.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines from `mibo run` around the problem.
      render: shell
