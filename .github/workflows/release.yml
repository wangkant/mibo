name: Release

# A v* tag must sit on main and pass the test suite; it then builds once,
# publishes that build to PyPI (trusted publishing), then creates the GitHub
# Release with the same files plus the Windows installer and the macOS app. A manual run
# from a branch only builds and uploads the artifacts; run it from a tag to release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the tagged commit to be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on main; merge it first, then tag main"
            exit 1
          fi
      - name: Run the test suite
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Check the tag and take its notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p notes
          python tools/release_notes.py "$GITHUB_REF_NAME" --out notes/release-notes.md
      - name: Build the sdist and the wheel
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<8"
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel before anything is published
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/python" -m pip install --quiet dist/*.whl
          VERSION=$("$RUNNER_TEMP/wheelenv/bin/python" -c "import mibo; print(mibo.__version__)")
          python tools/package_smoke.py --mibo "$RUNNER_TEMP/wheelenv/bin/mibo" --version "$VERSION"
      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Upload the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/release-notes.md
          if-no-files-found: error

  windows-installer:
    # The app frozen by PyInstaller and wrapped by Inno Setup: packaging/windows/build.ps1,
    # which installs Inno Setup (winget, else Chocolatey) when the runner has none.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: dist/mibo-*-setup.exe
          if-no-files-found: error

  macos-app:
    # The same PyInstaller spec makes mibo.app, put in a .dmg beside a
    # link to /Applications. The runner is Apple silicon, so the app is arm64.
    # It is unsigned: Gatekeeper asks the person to open it with right-click >
    # Open. Signing would need a Developer ID Application certificate (imported
    # into a temporary keychain from a secret), `codesign --deep --options runtime
    # --timestamp` over the .app, then `xcrun notarytool submit --wait` with an
    # App Store Connect API key (or an Apple ID and app-specific password) as
    # secrets, and `xcrun stapler staple` on the .app and the .dmg.
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Freeze the app
        # Installed, not editable, and frozen from outside the checkout: the
        # wheel's mibo/_bundled is what the spec reads.
        run: |
          python -m venv "$RUNNER_TEMP/appenv"
          "$RUNNER_TEMP/appenv/bin/python" -m pip install --quiet ".[app,web]" "pyinstaller>=6.10,<7"
          cd packaging/windows
          "$RUNNER_TEMP/appenv/bin/python" -m PyInstaller --noconfirm --clean \
            --distpath "$RUNNER_TEMP/frozen" --workpath "$RUNNER_TEMP/work" mibo.spec
          test -x "$RUNNER_TEMP/frozen/mibo.app/Contents/MacOS/mibo"
      - name: Put it in a disk image
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          mkdir -p "$RUNNER_TEMP/dmg" dist
          cp -R "$RUNNER_TEMP/frozen/mibo.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname mibo -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO \
            "dist/mibo-$VERSION-macos-arm64.dmg"
      - name: Upload the disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-app
          path: dist/mibo-*-macos-arm64.dmg
          if-no-files-found: error

  pypi:
    # Not before both apps are built: a version on PyPI has a GitHub Release with them.
    needs: [build, windows-installer, macos-app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mibo/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, pypi, windows-installer, macos-app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes/
      - name: Download the Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: apps/
      - name: Download the macOS app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-app
          path: apps/
      - name: Create the GitHub Release with the sdist, the wheel and the apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* apps/* \
            --verify-tag \
            --title "mibo ${GITHUB_REF_NAME#v}" \
            --notes-file notes/release-notes.md
