name: Cua Driver spike

# Stage X3 of the three-system design: can Cua Driver read and work other
# programs on Windows, macOS, Linux X11 and Linux Wayland? Each job runs
# tools/xplat/cua_check.py on the fixture (Tk, the design's choice, and Qt) and
# on a program the system ships, and keeps the trees, pictures and timings.
on:
  push:
    branches: [ci/xplat-cua]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xplat-cua-${{ github.ref }}
  cancel-in-progress: true

env:
  CUA_TAG: cua-driver-rs-v0.28.0
  CUA_DRIVER_RS_TELEMETRY_ENABLED: "0"
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CUA_ASSET: cua-driver-rs-0.28.0-windows-x86_64-binary.zip
      CUA_SHA256: 9db2096df8d80da4e73ffb797947dcdfab2a362faddd9d1b77682c77aace5aa9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the app and the fixture's Qt
        run: python -m pip install -e . PySide6-Essentials==6.10.1
      - name: Download Cua Driver and check it against the published checksum
        run: |
          mkdir -p cua && cd cua
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/$CUA_ASSET"
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/checksums.txt"
          grep -q "^$CUA_SHA256  $CUA_ASSET\$" checksums.txt
          echo "$CUA_SHA256  $CUA_ASSET" | sha256sum -c -
          unzip -q "$CUA_ASSET" -d bin
          find bin -type f | head -20
          echo "CUA_DRIVER=$(cygpath -w "$(find "$PWD/bin" -name cua-driver.exe | head -1)")" >> "$GITHUB_ENV"
          du -sh bin
      - name: Fixture in Tk
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit tk
      - name: Fixture in Qt
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt
      - name: Notepad, beside desk/uia.py
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --program notepad --uia
      - name: Summary
        if: always()
        run: python tools/xplat/cua_check.py --report out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cua-windows
          path: out

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CUA_ASSET: cua-driver-rs-0.28.0-darwin-universal-binary.tar.gz
      CUA_SHA256: aaaa29538fe7b1f103afb4eddeefe2dc137690f91f8074e333cfe0e76b49918d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the app and the fixture's Qt
        run: python -m pip install -e . PySide6-Essentials==6.10.1
      - name: Download Cua Driver and check it against the published checksum
        run: |
          mkdir -p cua && cd cua
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/$CUA_ASSET"
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/checksums.txt"
          grep -q "^$CUA_SHA256  $CUA_ASSET\$" checksums.txt
          echo "$CUA_SHA256  $CUA_ASSET" | shasum -a 256 -c -
          mkdir bin && tar -xzf "$CUA_ASSET" -C bin
          find bin | head -20
          driver="$(find "$PWD/bin" -type f -name cua-driver | head -1)"
          echo "CUA_DRIVER=$driver" >> "$GITHUB_ENV"
          echo "PYTHON_REAL=$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')" >> "$GITHUB_ENV"
          du -sh bin; codesign -dv "$driver" 2>&1 | head -8 || true
      - name: The grants the image already holds
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT service, client, auth_value FROM access WHERE service IN \
            ('kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceScreenCapture')" | tee tcc-before.txt
          csrutil status || true
          sw_vers
      # Which process must hold the grant when Mibo's python starts Cua Driver? The image grants its own
      # agent, so those rows go first; then the driver alone, python alone, and both.
      - name: The processes above this step
        run: |
          pid=$$
          while [ "$pid" -gt 1 ]; do ps -o pid=,ppid=,comm= -p "$pid"; pid=$(ps -o ppid= -p "$pid" | tr -d ' '); done
      - name: A. The image's own grants, fixture in Qt
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label macos-A-image
      - name: A. Fixture in Tk
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit tk
      - name: A. TextEdit
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --program TextEdit
      - name: Remove the image's grants
        run: |
          sudo sqlite3 -cmd ".timeout 10000" "/Library/Application Support/com.apple.TCC/TCC.db"             "DELETE FROM access WHERE service IN ('kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceScreenCapture')"
          sudo launchctl stop com.apple.tccd || true
          sleep 2
      - name: B. No grant at all
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label macos-B-none
      - name: C. Grant Cua Driver alone
        run: bash tools/xplat/grant_tcc.sh "$CUA_DRIVER"
      - name: C. Fixture with Cua Driver granted
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label macos-C-driver
      - name: D. Grant python alone, the parent that starts Cua Driver
        run: |
          sudo sqlite3 -cmd ".timeout 10000" "/Library/Application Support/com.apple.TCC/TCC.db"             "DELETE FROM access WHERE client='$CUA_DRIVER'"
          bash tools/xplat/grant_tcc.sh "$PYTHON_REAL"
      - name: D. Fixture with python granted
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label macos-D-python
      - name: E. Grant both
        run: bash tools/xplat/grant_tcc.sh "$CUA_DRIVER"
      - name: E. Fixture with both granted
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label macos-E-both
      # The process launchd started for the job is the responsible one: give it back its grant alone.
      - name: F. Grant the runner's agent alone
        run: |
          sudo sqlite3 -cmd ".timeout 10000" "/Library/Application Support/com.apple.TCC/TCC.db"             "DELETE FROM access WHERE client IN ('$CUA_DRIVER','$PYTHON_REAL')"
          bash tools/xplat/grant_tcc.sh /opt/hca/hosted-compute-agent
      - name: F. Fixture with the agent granted
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label macos-F-agent
      - name: G. Grant the shell launchd started, and its script
        run: |
          bash tools/xplat/grant_tcc.sh /bin/bash
          bash tools/xplat/grant_tcc.sh /opt/hca/start_hca.sh
      - name: G. Fixture with the launchd shell granted
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label macos-G-launchd
      - name: Summary
        if: always()
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT service, client, auth_value FROM access WHERE client LIKE '%cua%' OR client LIKE '%python%'" \
            > out/tcc-after.txt || true
          cp tcc-before.txt out/ || true
          python tools/xplat/cua_check.py --report out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cua-macos
          path: out

  linux-x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUA_ASSET: cua-driver-rs-0.28.0-linux-x86_64-binary.tar.gz
      CUA_SHA256: 120cd7f40340c5e012422aca393932767e228c224dd8b9df2124ca29c5e48226
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the screen, AT-SPI, gedit and Qt's libraries
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb openbox \
            dbus-x11 at-spi2-core gedit xdotool libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-image0 libxcb-shape0 libegl1 libgl1 libfontconfig1 tk
          python -m pip install -e . PySide6-Essentials==6.10.1
      - name: Download Cua Driver and check it against the published checksum
        run: |
          mkdir -p cua && cd cua
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/$CUA_ASSET"
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/checksums.txt"
          grep -q "^$CUA_SHA256  $CUA_ASSET\$" checksums.txt
          echo "$CUA_SHA256  $CUA_ASSET" | sha256sum -c -
          mkdir bin && tar -xzf "$CUA_ASSET" -C bin
          find bin | head -20
          echo "CUA_DRIVER=$(find "$PWD/bin" -type f -name cua-driver | head -1)" >> "$GITHUB_ENV"
          du -sh bin
      # Xvfb, a D-Bus session and the AT-SPI bridge as xa11y/setup-a11y starts them (MIT, see NOTICE), with openbox.
      - name: Start the screen, D-Bus and AT-SPI
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -ac &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          export DISPLAY=:99
          sleep 1
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          printf 'NO_AT_BRIDGE=0\nACCESSIBILITY_ENABLED=1\nQT_LINUX_ACCESSIBILITY_ALWAYS_ON=1\n' >> "$GITHUB_ENV"
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 1
          /usr/libexec/at-spi2-registryd &
          sleep 1
          for prop in IsEnabled ScreenReaderEnabled; do
            dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.freedesktop.DBus.Properties.Set \
              string:org.a11y.Status string:"$prop" variant:boolean:true || true
          done
          openbox &
          sleep 1
          xdotool getdisplaygeometry
      - name: Fixture in Tk
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit tk
      - name: Fixture in Qt
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt
      - name: gedit
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --program gedit
      - name: Summary
        if: always()
        run: python tools/xplat/cua_check.py --report out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cua-linux-x11
          path: out

  linux-wayland:
    # Headless sway: the result is recorded, a pass is not required.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUA_ASSET: cua-driver-rs-0.28.0-linux-x86_64-binary.tar.gz
      CUA_SHA256: 120cd7f40340c5e012422aca393932767e228c224dd8b9df2124ca29c5e48226
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install sway, AT-SPI, gedit and Qt's libraries
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends sway xwayland \
            dbus-x11 at-spi2-core gedit libxkbcommon0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -e . PySide6-Essentials==6.10.1
      - name: Download Cua Driver and check it against the published checksum
        run: |
          mkdir -p cua && cd cua
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/$CUA_ASSET"
          curl -fsSLO "https://github.com/trycua/cua/releases/download/$CUA_TAG/checksums.txt"
          grep -q "^$CUA_SHA256  $CUA_ASSET\$" checksums.txt
          echo "$CUA_SHA256  $CUA_ASSET" | sha256sum -c -
          mkdir bin && tar -xzf "$CUA_ASSET" -C bin
          echo "CUA_DRIVER=$(find "$PWD/bin" -type f -name cua-driver | head -1)" >> "$GITHUB_ENV"
      - name: Start headless sway, D-Bus and AT-SPI
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" && mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -d > "$RUNNER_TEMP/sway.log" 2>&1 &
          for i in $(seq 50); do ls "$XDG_RUNTIME_DIR"/wayland-* >/dev/null 2>&1 && break; sleep 0.2; done
          socket="$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-* | grep -v lock | head -1)")"
          echo "WAYLAND_DISPLAY=$socket" >> "$GITHUB_ENV"
          printf 'NO_AT_BRIDGE=0\nACCESSIBILITY_ENABLED=1\nQT_LINUX_ACCESSIBILITY_ALWAYS_ON=1\n' >> "$GITHUB_ENV"
          printf 'QT_QPA_PLATFORM=wayland\nGDK_BACKEND=wayland\nCUA_DRIVER_RS_ENABLE_WAYLAND=1\n' >> "$GITHUB_ENV"
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 1
          /usr/libexec/at-spi2-registryd &
          sleep 1
          echo "sway socket: $socket"; tail -5 "$RUNNER_TEMP/sway.log"
      - name: Fixture in Qt (native Wayland)
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --toolkit qt --label linux-wayland-qt
      - name: gedit (native Wayland)
        continue-on-error: true
        run: python tools/xplat/cua_check.py --driver "$CUA_DRIVER" --out out --program gedit --label linux-wayland-gedit
      - name: Summary
        if: always()
        run: |
          cp "$RUNNER_TEMP/sway.log" out/ || true
          python tools/xplat/cua_check.py --report out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cua-linux-wayland
          path: out
