name: Electron pane

# Page operation in an Electron view over its in-process debugger, on each system's own runner and screen
# (tools/xplat/epane_check.py): the spike that decides whether the browser pane moves to Electron.
on:
  push:
    branches: [ci/xplat-pane]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xplat-pane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pane:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mibo/electron/package-lock.json
      - name: Install a display, a window manager and what Electron loads (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox libnss3 libgbm1 libasound2t64 \
            libgtk-3-0t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libdrm2 libxkbcommon0
          # Ubuntu 24.04 forbids unprivileged user namespaces, which Chromium's sandbox needs; an installed
          # build gets them from its AppArmor profile. Allowing them here keeps the sandbox on, as it is there.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install mibo and the websocket the check speaks
        run: python -m pip install -e . "websockets>=13,<18" "Pillow>=10.4,<14"
      - name: Install the pinned Electron
        working-directory: mibo/electron
        # Electron's package fetches its binary in a step of its own, checked against the checksums it ships.
        run: |
          npm ci --no-audit --no-fund
          npx --no install-electron
      - name: Size of the Electron download
        shell: python
        run: |
          import os, pathlib, sys
          home = pathlib.Path.home()
          cache = {"win32": pathlib.Path(os.environ.get("LOCALAPPDATA", "")) / "electron" / "Cache",
                   "darwin": home / "Library" / "Caches" / "electron"}.get(sys.platform, home / ".cache" / "electron")
          for path in sorted(cache.rglob("*.zip")):
              print(f"{path.name}: {path.stat().st_size / 2**20:.1f} MB")
      - name: Operate pages in an Electron view (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x900x24" sh -c 'openbox & sleep 1; python tools/xplat/epane_check.py --google --out epane-out'
      - name: Operate pages in an Electron view
        if: runner.os != 'Linux'
        run: python tools/xplat/epane_check.py --google --out epane-out
      - name: Keep the results and pictures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: epane-${{ matrix.os }}
          path: |
            epane-out/*.json
            epane-out/**/*.png
            epane-out/**/*.jpg
            epane-out/electron.log
          retention-days: 14
