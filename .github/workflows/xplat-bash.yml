name: Bash reading

# Sorts the labelled bash commands (tools/xplat/bash_corpus.jsonl) with shell/bashread.py on macOS and Linux and
# holds them to the floor in tools/xplat/bashjudge_check.py; on Windows the whole suite runs with the new reader in.
on:
  push:
    branches: ["ci/xplat-bash"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xplat-bash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Sort the corpus and hold it to the floor
        run: python tools/xplat/bashjudge_check.py "$(mktemp -d)"
      - name: The bash reading tests
        run: python -m pytest -q tests/layers/commands

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Sort the corpus and hold it to the floor
        run: python tools/xplat/bashjudge_check.py "$(mktemp -d)"
      - name: Run the test suite
        run: python -m pytest -q
