name: Cross-system

# One job per system for the checks of the three-system work, each on a hosted runner of its own: Windows, macOS,
# Linux on X11 with AT-SPI, and Linux on Wayland. Later stages add their checks (tools/xplat/) as steps of these
# jobs. tools/xplat/wsl_run.sh runs the same checks in WSL on a virtual screen.
on:
  push:
    branches: [main, "ci/xplat-*"]
    paths:
      - tools/xplat/**
      - .github/workflows/xplat.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xplat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The system
        run: python -c "import platform; print(platform.platform(), platform.machine())"

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The system
        run: python -c "import platform; print(platform.platform(), platform.machine())"

  linux-x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install a display, a window manager, D-Bus and AT-SPI
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb openbox dbus dbus-x11 at-spi2-core xdotool x11-utils
      # Xvfb, the session bus and the AT-SPI daemons start in one shell and stay up for the later steps, which get
      # their addresses through GITHUB_ENV (xa11y's setup-a11y recipe, see NOTICE).
      - name: Start the display, the window manager, the session bus and AT-SPI
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 -ac >/dev/null 2>&1 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1
          openbox >/dev/null 2>&1 &
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          printf '%s\n' NO_AT_BRIDGE=0 AT_SPI_CLIENT=true ACCESSIBILITY_ENABLED=1 >> "$GITHUB_ENV"
          /usr/libexec/at-spi-bus-launcher --launch-immediately >/dev/null 2>&1 &
          sleep 1
          /usr/libexec/at-spi2-registryd >/dev/null 2>&1 &
          sleep 1
          for prop in IsEnabled ScreenReaderEnabled; do
            dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus \
              org.freedesktop.DBus.Properties.Set string:org.a11y.Status string:"$prop" variant:boolean:true
          done
      - name: The screen, the window manager and the accessibility bus answer
        run: |
          set -euo pipefail
          xdotool getdisplaygeometry
          xprop -root _NET_SUPPORTING_WM_CHECK | grep -q window
          dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress | grep -q unix:
          dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus \
            org.freedesktop.DBus.Properties.Get string:org.a11y.Status string:IsEnabled | grep -q true
          echo "X11 :99 with openbox and AT-SPI is up"

  linux-wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install sway, XWayland and D-Bus
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            sway xwayland dbus dbus-x11
      # sway on its headless backend with one virtual output and no X display (xa11y's run_wayland_portal.sh, see
      # NOTICE); the later steps get its sockets through GITHUB_ENV.
      - name: Start a headless sway
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          eval "$(dbus-launch --sh-syntax)"
          printf 'output HEADLESS-1 resolution 1280x1024 position 0,0\n' > "$RUNNER_TEMP/sway.conf"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman \
            sway -c "$RUNNER_TEMP/sway.conf" >"$RUNNER_TEMP/sway.log" 2>&1 &
          for _ in $(seq 1 50); do
            sock=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-*' ! -name '*.lock' -print -quit)
            ipc=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'sway-ipc.*.sock' -print -quit)
            [ -n "$sock" ] && [ -n "$ipc" ] && break
            sleep 0.2
          done
          if [ -z "$sock" ] || [ -z "$ipc" ]; then cat "$RUNNER_TEMP/sway.log"; exit 1; fi
          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "XDG_SESSION_TYPE=wayland"
            echo "XDG_CURRENT_DESKTOP=sway"
            echo "WAYLAND_DISPLAY=$(basename "$sock")"
            echo "SWAYSOCK=$ipc"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          } >> "$GITHUB_ENV"
      - name: The compositor answers with its one output
        run: |
          set -euo pipefail
          test -z "${DISPLAY:-}"
          swaymsg -t get_outputs | grep -q HEADLESS-1
          echo "headless sway is up on $WAYLAND_DISPLAY"
