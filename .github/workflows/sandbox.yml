name: Sandbox

# Checks that need a real window, a pointer or keys, each on a hosted runner of its own (its own screen, pointer,
# keys and Start menu), never on a desk someone is using. Each suite is a script under tools/sandbox/ that starts
# from nothing with stand-ins and ends with a table; its log, pictures and result.json are uploaded.
# tools/sandbox/run.py starts a run from a checkout, waits, and prints the table of feature by system.
on:
  push:
    branches: [ci/sandbox]
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites, comma-separated: window,firstrun,pet,pane,programs,everyday"
        default: "window,firstrun,pet,pane,programs,everyday"
      systems:
        description: "Systems, comma-separated: windows,linux,macos"
        default: "windows,linux,macos"
      real_model:
        description: "Run the suites that need a real model on claude-haiku-5-5 (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false
      budget:
        description: "Spending cap in dollars for each suite that uses the real model"
        default: "0.30"

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Pick the systems asked for
        id: pick
        env:
          SYSTEMS: ${{ inputs.systems || 'windows,linux,macos' }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          runner = {"windows": "windows-2022", "linux": "ubuntu-24.04", "macos": "macos-15"}
          picked = [s.strip() for s in os.environ["SYSTEMS"].split(",") if s.strip() in runner]
          print("include=" + json.dumps([{"system": s, "os": runner[s]} for s in picked]))
          EOF

  sandbox:
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      SUITES: ${{ inputs.suites || 'window,firstrun,pet,pane,programs,everyday' }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install a display, a pointer driver and what Qt's web engine loads (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool libegl1 libgl1 libnss3 libasound2t64 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libdbus-1-3
      # A person's usual screen: at the runner's 1024 by 768 the window cannot make room for a page beside the chat.
      - name: A 1920 by 1080 screen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      # The runner has no UAC, so all it starts runs as administrator, which Mibo never operates: the programs the
      # programs suite operates run as this standard user, made for this run alone.
      - name: A standard user for the programs Mibo operates (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $key = [guid]::NewGuid().ToString() + "-Aa1"
          Write-Output "::add-mask::$key"
          New-LocalUser -Name mibo-person -Password (ConvertTo-SecureString $key -AsPlainText -Force) | Out-Null
          "SANDBOX_PERSON=mibo-person" >> $env:GITHUB_ENV
          "SANDBOX_PERSON_KEY=$key" >> $env:GITHUB_ENV
      - name: Install mibo with its window and the page driver
        run: python -m pip install -e ".[app,dev]"
      - name: Run the suites
        shell: bash
        env:
          # The runner forbids the user namespaces Chromium's sandbox needs.
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          # Only when asked for; GitHub masks it in every log, and the suites write it into scratch homes alone.
          SANDBOX_MODEL_KEY: ${{ inputs.real_model && secrets.ANTHROPIC_API_KEY || '' }}
          SANDBOX_BUDGET: ${{ inputs.budget || '0.30' }}
        run: |
          failed=""
          for suite in ${SUITES//,/ }; do
            echo "::group::$suite"
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a -s "-screen 0 1280x900x24" python tools/sandbox/$suite.py --out "sandbox-out/$suite" || failed="$failed $suite"
            else
              python tools/sandbox/$suite.py --out "sandbox-out/$suite" || failed="$failed $suite"
            fi
            echo "::endgroup::"
          done
          python tools/sandbox/run.py table sandbox-out | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$SANDBOX_MODEL_KEY" ] && grep -rqF "$SANDBOX_MODEL_KEY" sandbox-out; then
            echo "the key is in the results: they are not uploaded"
            rm -rf sandbox-out
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi
      - name: Upload the logs and pictures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-${{ matrix.system }}
          path: sandbox-out
          if-no-files-found: ignore
          retention-days: 14
