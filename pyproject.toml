[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personagent"
version = "1.5.0"
description = "An agent that behaves like a person, on every platform you use: it has a character of its own, remembers, learns from the people it talks to, and judges for itself when to speak."
readme = "README.md"
requires-python = ">=3.10"
# Code adapted from MIT projects keeps their licence (NOTICE), and the three
# character portraits are CC BY-NC-SA 4.0 (no commercial use).
license = "Apache-2.0 AND MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "NOTICE", "persona_agent/static/characters/LICENSE.md"]
authors = [{ name = "Qiankang Wang" }]
keywords = [
    "llm", "agent", "persona", "chatbot", "group-chat", "memory", "onebot",
    "prompt-engineering", "self-evolution", "few-shot", "rag",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.128,<1",
    # A floor here keeps the resolver off the pydantic 1.x line.
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    # Direct, not transitive: ingestion.py's SSRF guard imports httpcore._backends.auto.
    "httpcore>=1.0,<2",
    # Decodes the first frame of a GIF for vision endpoints that reject GIFs.
    "Pillow>=10.4,<14",
    # The no-key web search backend (DuckDuckGo).
    "ddgs>=9,<10",
    # Reads robots.txt as Scrapy does, wildcards and a group for Mibo before the one for all (web/sites.py).
    "protego>=0.7,<1",
    # Reads the YAML front matter of a skill's SKILL.md, as other agents' hosts do (skills/store.py).
    "pyyaml>=6,<7",
    # The person's MCP servers, through the official SDK (mcp_client.py); jsonschema checks a call's
    # arguments against the tool's schema before the card (mcp_tools.py).
    "mcp>=2.3,<3",
    "jsonschema>=4.20,<5",
    # Keeps MCP servers' values and sign-in tokens in the system's credential store (secretstore.py).
    "keyring>=25,<26",
    # Scheduled tasks (schedule.py): dateutil's rrule finds the next time of a rhythm; tzlocal names this
    # computer's zone; tzdata is the zone database Windows lacks, for zoneinfo and daylight saving.
    "python-dateutil>=2.9,<3",
    "tzlocal>=5.3,<6",
    "tzdata>=2025.2",
    # Opens the local page in a window of its own. Windows has WebView2 for it;
    # elsewhere it needs a system toolkit, so it is the `app` extra there.
    "pywebview>=6,<7; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The window of its own on macOS and Linux; without it the page opens in the browser.
# pywebview alone brings no toolkit on Linux, so Qt comes with it there.
app = ["pywebview>=6,<7; sys_platform != 'linux'", "pywebview[qt]>=6,<7; sys_platform == 'linux'"]
# Walks on the web: drives the Edge, Chrome or Chromium already installed, so
# no browser is downloaded.
web = ["playwright>=1.49,<2"]
# What CI installs on top of the runtime dependencies.
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "playwright>=1.49,<2"]

[project.scripts]
personagent = "persona_agent.cli:main"

[project.urls]
Homepage = "https://github.com/wangkant/personagent"
Issues = "https://github.com/wangkant/personagent/issues"
Changelog = "https://github.com/wangkant/personagent/blob/main/CHANGELOG.md"
Documentation = "https://github.com/wangkant/personagent/blob/main/docs/guide.md"

# The checkout's shared files ship inside the package as persona_agent/_bundled,
# where home.resource() finds them in an installed copy.
[tool.hatch.build.targets.sdist]
# The version PyPI took for 1.2.1; hatchling defaults to a newer one.
core-metadata-version = "2.4"
only-include = ["persona_agent", "data", ".env.example"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
only-include = ["persona_agent", "data"]
# README illustrations: linked from published READMEs, read by nothing installed.
exclude = ["persona_agent/static/*.webp"]
# An editable install imports the checkout itself, which reads these files in place.
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.sources]
"data" = "persona_agent/_bundled/data"

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "persona_agent/_bundled/.env.example"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites import the checkout, and the tools under tools/.
pythonpath = [".", "tools"]
