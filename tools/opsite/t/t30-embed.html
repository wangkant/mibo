<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>新手养猫第一周 - 宠物社区</title>
<style>
body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f6f7f9; }
main { max-width: 680px; margin: 24px 0 24px 40px; background: #fff; padding: 18px 24px; border-radius: 8px; }
.comments { width: 100%; height: 330px; border: 1px solid #eee; border-radius: 6px; }
.card { width: 100%; height: 150px; border: 1px solid #eee; border-radius: 6px; }
.widget { position: fixed; right: 24px; bottom: 24px; width: 320px; height: 380px; border: 0; border-radius: 12px;

<body><main>
<h1>新手养猫：第一周的喂养安排</h1>
<p>小猫到家的第一周，饮食以原来的猫粮为主，每天四到五顿，每次少量。换粮要用七天慢慢混合。</p>
<p>准备干净的饮水，放在离食盆稍远的地方。猫砂盆放在安静的角落。</p>
<h2>评论</h2>
<iframe id="comments" class="comments" title="评论"></iframe>
<h2>开通会员</h2>
<p>会员可看全部养护课程，68 元一年。</p>
<iframe id="card" class="card" title="支付"></iframe>
</main>
<iframe id="widget" class="widget" title="在线客服"></iframe>
<script>
// Each widget comes from another site, as embedded ones do: the page is opened at 127.0.0.1 and the widgets are
// served under localhost names (the port in ?frames=, else this page's), so each runs in a process of its own.
const port = new URLSearchParams(location.search).get("frames") || location.port;
const at = (name, sub = "") => `http://${sub}localhost:${port}/t/${name}`;
document.getElementById("comments").src = at("t30-comments.html");
document.getElementById("card").src = at("t30-card.html", "pay.");
document.getElementById("widget").src = at("t11-widget.html");
</script>
<script src="/t/kit.js"></script>
