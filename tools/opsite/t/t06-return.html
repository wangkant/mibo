<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>申请退货 - 订单 20261102-88</title>
<style>
body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f2f2f2; }
form { max-width: 560px; margin: 30px auto; background: #fff; padding: 22px 26px; border-radius: 6px; }
label { display: block; margin: 14px 0 4px; color: #555; }
select, textarea { width: 100%; padding: 6px; box-sizing: border-box; } textarea { height: 80px; }
.item { display: flex; gap: 12px; align-items: center; padding: 10px; background: #fafafa; }
button { margin-top: 16px; background: #ff5000; color: #fff; border: 0; padding: 8px 24px; border-radius: 4px; }
.ok { color: #2a8; }
</style></head>
<body>
<form id="f">
  <h2>申请退货</h2>
  <div class="item"><span>🧥</span><div>羊毛针织开衫 · 灰色 · L 码<br><small>订单号 20261102-88 · ¥329.00</small></div></div>
  <label for="reason">退货原因</label>
  <select id="reason" name="reason">
    <option value="">请选择退货原因</option>
    <option value="nolike">不喜欢/不想要</option><option value="quality">质量问题</option>
    <option value="wrong">商家发错货</option><option value="damaged">商品破损</option>
    <option value="late">未按约定时间发货</option><option value="size">尺码不合适</option>
    <option value="color">颜色与描述不符</option><option value="fake">假冒品牌</option>
    <option value="missing">少件/漏发</option><option value="other">其他</option>
  </select>
  <label for="note">退货说明</label>
  <textarea id="note" name="note" placeholder="请描述具体情况（选填）"></textarea>
  <button type="submit">提交申请</button>
  <p class="ok" id="ok"></p>
</form>
<script src="/t/kit.js"></script>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const reason = document.getElementById("reason").value;
  if (!reason) { document.getElementById("ok").textContent = "请选择退货原因"; return; }
  if ((await post("/api/return", { reason, note: document.getElementById("note").value })).ok)
    document.getElementById("ok").textContent = "退货申请已提交，等待商家处理";
});
</script></body></html>
