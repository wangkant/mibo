<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>账号设置</title>
<style>
body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f2f3f5; }
.box { max-width: 680px; margin: 24px auto; background: #fff; border-radius: 10px; display: flex; min-height: 360px; }
.tabs { width: 150px; border-right: 1px solid #eee; padding: 10px 0; } .tab { padding: 8px 18px; cursor: pointer; }
.tab[aria-selected=true] { background: #eef3ff; color: #2456c7; } .pane { flex: 1; padding: 18px 24px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
select { padding: 5px; }
</style></head>
<body><div class="box">
<div class="tabs" role="tablist">
  <div class="tab" role="tab" aria-selected="true" data-p="basic">基本资料</div>
  <div class="tab" role="tab" aria-selected="false" data-p="privacy">隐私</div>
  <div class="tab" role="tab" aria-selected="false" data-p="notice">通知</div>
</div>
<div class="pane">
  <section id="basic"><div class="row"><span>昵称</span><span>小乐</span></div><div class="row"><span>地区</span><span>杭州</span></div></section>
  <section id="privacy" hidden>
    <div class="row"><label for="who">谁可以看我的动态</label><select id="who"><option value="all">所有人</option><option value="friends">仅好友</option><option value="me">仅自己</option></select></div>
    <div class="row"><label for="dm">谁可以私信我</label><select id="dm"><option value="all">所有人</option><option value="friends">仅好友</option></select></div>
    <p><button id="save" type="button">保存设置</button> <span id="said"></span></p>
  </section>
  <section id="notice" hidden><div class="row"><span>邮件通知</span><span>已开启</span></div></section>
</div></div>
<script src="/t/kit.js"></script>
<script>
for (const tab of document.querySelectorAll(".tab")) {
  tab.onclick = () => {
    for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t === tab));
    for (const s of document.querySelectorAll(".pane section")) s.hidden = s.id !== tab.dataset.p;
  };
}
document.getElementById("save").onclick = async () => {
  const body = { who: document.getElementById("who").value, dm: document.getElementById("dm").value };
  if ((await post("/api/privacy", body)).ok) document.getElementById("said").textContent = "已保存";
};
</script></body></html>
