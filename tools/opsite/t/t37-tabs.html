<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>内容管理 - 创作中心</title>
<style>
body { margin: 0; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; background: #f6f6f6; }
main { max-width: 960px; margin: 20px auto; background: #fff; border-radius: 6px; padding: 0 0 16px; }
.tabs { display: flex; gap: 28px; padding: 0 20px; border-bottom: 1px solid #eee; }
.tab { padding: 14px 0; cursor: pointer; color: #646464; }
.tab.is-active { color: #1772f6; border-bottom: 2px solid #1772f6; font-weight: 600; }
.pane { padding: 8px 20px; } .item { padding: 10px 0; border-bottom: 1px solid #f3f3f3; } .item small { color: #999; }
table { width: 100%; border-collapse: collapse; } th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; }
th { color: #666; background: #fafafa; } td.num { text-align: right; }
</style></head>
<body><main>
<div class="tabs"><div class="tab is-active" data-k="all">全部</div><div class="tab" data-k="post">文章</div>
  <div class="tab" data-k="answer">回答</div><div class="tab" data-k="data">数据列表</div></div>
<div class="pane" id="pane"></div>
</main>
<script src="/t/kit.js"></script>
<script>
// Tabs drawn as plain blocks with a class for the chosen one, as many sites do; 全部 is chosen when the page opens
// and pressing it again changes nothing. The reading counts are only in 数据列表, which takes a moment to load.
// The most-read row (row 48) changes its count with each reset of the site (tasks.w_reads).
const NAMES = ["周末去哪儿看展", "一个人吃饭的仪式感", "我的极简衣橱", "城市里的小公园", "通勤路上的播客", "第一次学做面包",
  "旧物改造记", "雨天的书单"];
let round = 0, current = "all";
fetch("/api/state").then((r) => r.json()).then((s) => { round = s.round || 0; show("all"); });
function rows() {
  const out = [];
  for (let i = 0; i < 60; i++) {
    const top = i === 47;
    out.push({ title: top ? "我在小城开了一家旧书店" : NAMES[i % 8] + "（" + (i + 1) + "）", kind: i % 3 ? "文章" : "回答",
      reads: top ? 7700 + 37 * (round % 9) : 90 + ((i * 4099) % 7400), likes: 5 + ((i * 97) % 600) });
  }
  return out;
}
function show(k) {
  if (k === current && document.getElementById("pane").childElementCount) return;
  current = k;
  for (const t of document.querySelectorAll(".tab")) t.classList.toggle("is-active", t.dataset.k === k);
  const pane = document.getElementById("pane");
  if (k === "data") {
    pane.innerHTML = "<p>加载中…</p>";
    setTimeout(() => {
      pane.innerHTML = "<table><thead><tr><th>标题</th><th>类型</th><th class='num'>阅读</th><th class='num'>赞同</th></tr></thead><tbody></tbody></table>";
      for (const r of rows()) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td></td><td>${r.kind}</td><td class="num">${r.reads}</td><td class="num">${r.likes}</td>`;
        tr.firstChild.textContent = r.title;
        pane.querySelector("tbody").append(tr);
      }
    }, 1500);
    return;
  }
  pane.innerHTML = "";
  for (const r of rows().filter((r) => k === "all" || (k === "post" ? r.kind === "文章" : r.kind === "回答")).slice(0, 12)) {
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML = "<div></div><small>已发布 · 可在数据列表查看阅读与赞同</small>";
    d.firstChild.textContent = r.title;
    pane.append(d);
  }
}
for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => show(t.dataset.k));
</script></body></html>
