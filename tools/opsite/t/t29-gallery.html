<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>相册 - 小站</title>
<link rel="stylesheet" href="/site.css?a">
<link rel="stylesheet" href="/site.css?b">
<style>.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; } .grid img { width: 100%; height: 60px; }</style>
</head>
<body>
<header><b>小站相册</b><a href="/index.html">首页</a></header>
<main><div class="card"><h1>秋天的湖边</h1><div class="grid" id="grid"></div></div></main>
<script src="/t/kit.js"></script>
<script src="/t/kit.js?b" defer></script>
<script>
// A page as most are: two dozen pictures and a few scripts and styles beside the document.
for (let i = 0; i < 24; i++) {
  const img = document.createElement("img");
  img.src = `/site.css?img=${i}`;
  img.alt = `照片 ${i + 1}`;
  document.getElementById("grid").append(img);
}
</script>
</body></html>
