<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>播放设置</title>
<style>
body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f7f7f9; }
main { max-width: 420px; margin: 30px auto; background: #fff; border-radius: 10px; padding: 16px 20px; }
.track { position: relative; width: 200px; height: 6px; background: #ddd; border-radius: 3px; margin: 18px 0; }
.knob { position: absolute; top: -7px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
  background: #4a7bd0; cursor: grab; }
button { margin-top: 8px; }
</style></head>
<body><main>
<h2>播放设置</h2>
<p>音量 <b id="value">30</b></p>
<!-- A slider drawn from two divs: no role, no name; it moves under the mouse or by the arrow keys. -->
<div class="track" id="track"><div class="knob" id="knob" tabindex="0"></div></div>
<button id="save">保存</button>
<p id="said"></p>
</main>
<script src="/t/kit.js"></script>
<script>
let volume = 30, held = false;
const draw = () => { knob.style.left = (volume * 2) + "px"; value.textContent = volume; };
const to = (x) => { volume = Math.max(0, Math.min(100, Math.round((x - track.getBoundingClientRect().left) / 2))); draw(); };
knob.addEventListener("mousedown", (e) => { held = true; e.preventDefault(); });
document.addEventListener("mousemove", (e) => { if (held) to(e.clientX); });
document.addEventListener("mouseup", () => { held = false; });
knob.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") volume = Math.max(0, volume - 1);
  if (e.key === "ArrowRight") volume = Math.min(100, volume + 1);
  draw();
});
save.onclick = () => post("/api/volume", { value: volume }).then(() => { said.textContent = "已保存"; });
draw();
</script>
</body></html>
