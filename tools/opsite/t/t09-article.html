<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>城市骑行指南：十条路线 - 每日生活</title>
<style>
body { margin: 0; font: 16px/1.8 Georgia, "Songti SC", serif; background: #fff; color: #222; }
article { max-width: 680px; margin: 30px auto 160px; }
.like { margin-top: 24px; border: 1px solid #ddd; background: #fff; border-radius: 20px; padding: 6px 18px; cursor: pointer; font: 15px system-ui; }
.like.on { border-color: #e33; color: #e33; }
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; }
.modal { background: #fff; width: 380px; border-radius: 12px; padding: 26px; position: relative; font-family: system-ui; }
.modal .x { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 22px; cursor: pointer; color: #999; }
.modal input { width: 100%; padding: 8px; box-sizing: border-box; } .modal .sub { margin-top: 10px; width: 100%; padding: 8px; background: #111; color: #fff; border: 0; }
.cookie { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #eee; padding: 14px 20px; display: flex; gap: 12px;
  align-items: center; font: 14px system-ui; z-index: 40; }
.cookie p { flex: 1; margin: 0; } .cookie button { padding: 6px 14px; border-radius: 4px; border: 0; cursor: pointer; }
</style></head>
<body>
<article>
  <h1>城市骑行指南：十条适合周末的路线</h1>
  <p><small>每日生活 · 2026-11-18 · 阅读 3.2 万</small></p>
  <p>秋冬之交，正是骑行的好时候。我们整理了十条难度不同的路线，从江边绿道到老城小巷，适合不同体力的你。</p>
  <p>第一条：滨江绿道，全程 18 公里，几乎没有坡，适合新手和带孩子的家庭。</p>
  <p>第二条：老城环线，穿过三座古桥，沿途小吃很多，建议上午出发。</p>
  <p>骑行时请佩戴头盔，注意避让行人。</p>
  <button class="like" id="like">赞 <span id="n">236</span></button>
</article>
<div class="cookie" id="cookie"><p>我们使用 Cookie 来改进体验和投放广告。你可以选择接受全部，或只保留必要的 Cookie。</p>
  <button id="c-need">仅必要 Cookie</button><button id="c-all" style="background:#e33;color:#fff">接受全部</button></div>
<div class="mask" id="mask"><div class="modal" role="dialog" aria-label="订阅周报">
  <button class="x" id="x">×</button>
  <h3>订阅「每日生活」周报</h3><p>每周五，把最好的生活方式文章送到你的邮箱。</p>
  <input type="email" placeholder="你的邮箱"><button class="sub" id="sub">订阅</button>
</div></div>
<script src="/t/kit.js"></script>
<script>
const $ = (id) => document.getElementById(id);
setTimeout(() => { $("mask").hidden = false; }, 0);
$("x").addEventListener("click", () => { $("mask").hidden = true; $("mask").style.display = "none"; });
$("sub").addEventListener("click", () => post("/api/subscribe", {}));
$("c-need").addEventListener("click", async () => { await post("/api/consent", { choice: "necessary" }); $("cookie").remove(); });
$("c-all").addEventListener("click", async () => { await post("/api/consent", { choice: "all" }); $("cookie").remove(); });
$("like").addEventListener("click", async () => {
  if ($("like").classList.contains("on")) return;
  if ((await post("/api/like", { article: "a17" })).ok) { $("like").classList.add("on"); $("n").textContent = 237; }
});
</script></body></html>
