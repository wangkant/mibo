<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>设置 - 通知与外观</title>
<style>
body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f2f3f5; }
main { max-width: 560px; margin: 24px auto; background: #fff; border-radius: 10px; padding: 8px 20px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
.row small { display: block; color: #999; }
.sw { width: 44px; height: 24px; border-radius: 12px; background: #ccc; position: relative; cursor: pointer; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
.sw[aria-checked=true] { background: #1677ff; } .sw[aria-checked=true]::after { left: 22px; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 4px 14px; border-radius: 14px; }
</style></head>
<body><main>
<h2>通知与外观</h2>
<div id="rows"></div>
</main><div class="toast" id="toast" hidden></div>
<script src="/t/kit.js"></script>
<script>
const SETTINGS = [["push", "推送通知", "新消息时在手机上提醒", true], ["email", "邮件通知", "每周发送活动摘要到邮箱", true],
  ["sms", "短信通知", "重要的账号变动", false], ["dark", "深色模式", "界面使用深色背景", false], ["public", "公开我的主页", "所有人都能看到你的动态", true]];
for (const [key, name, hint, on] of SETTINGS) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<div><span class="nm"></span><small></small></div><div class="sw" role="switch" tabindex="0" aria-checked="${on}"></div>`;
  row.querySelector(".nm").textContent = name;
  row.querySelector("small").textContent = hint;
  const sw = row.querySelector(".sw");
  sw.setAttribute("aria-label", name);
  sw.addEventListener("click", async () => {
    const next = sw.getAttribute("aria-checked") !== "true";
    // Saved the moment it is switched, as most settings pages do.
    if ((await post("/api/setting", { key, on: next })).ok) {
      sw.setAttribute("aria-checked", String(next));
      const t = document.getElementById("toast");
      t.textContent = "已保存"; t.hidden = false; setTimeout(() => { t.hidden = true; }, 1200);
    }
  });
  document.getElementById("rows").append(row);
}
</script></body></html>
