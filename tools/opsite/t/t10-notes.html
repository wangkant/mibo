<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>我的笔记</title>
<style>
body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #fffdf6; }
main { max-width: 600px; margin: 30px auto; }
.n { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #eee5c8; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
.n .t { flex: 1; } .n .t small { color: #aaa; display: block; }
.ic { width: 30px; height: 30px; border: 0; background: none; border-radius: 6px; cursor: pointer; position: relative; color: #888; }
.ic:hover { background: #f6f0dc; }
.ic:hover::after { content: attr(data-tooltip); position: absolute; top: 32px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.ic.on { color: #f5a623; }
</style></head>
<body><main>
<h2>我的笔记</h2>
<div id="list"></div>
</main>
<script src="/t/kit.js"></script>
<script>
const ICON = {
  star: '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="m12 17.3 6.2 3.7-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7 2 9.3l5.4 4.7-1.6 7z"/></svg>',
  share: '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M18 16a3 3 0 0 0-2.4 1.2l-7-3.5a3 3 0 0 0 0-1.4l7-3.5A3 3 0 1 0 15 7l-7 3.5a3 3 0 1 0 0 3L15 17a3 3 0 1 0 3-1z"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>',
};
const NOTES = [["n1", "读书摘抄", "11-17"], ["n2", "周末计划", "11-15"], ["n3", "购物清单", "11-12"], ["n4", "会议记录", "11-10"]];
for (const [id, title, day] of NOTES) {
  const el = document.createElement("div");
  el.className = "n";
  el.innerHTML = `<div class="t"><b></b><small>${day}</small></div>
    <button class="ic" data-tooltip="收藏">${ICON.star}</button><button class="ic" data-tooltip="分享">${ICON.share}</button><button class="ic" data-tooltip="删除">${ICON.trash}</button>`;
  el.querySelector("b").textContent = title;
  const [star, share, trash] = el.querySelectorAll("button");
  star.addEventListener("click", async () => {
    const on = !star.classList.contains("on");
    if ((await post("/api/star", { note: id, on })).ok) star.classList.toggle("on", on);
  });
  share.addEventListener("click", () => post("/api/share", { note: id }));
  trash.addEventListener("click", async () => { if ((await post("/api/delete-note", { note: id })).ok) el.remove(); });
  document.getElementById("list").append(el);
}
</script></body></html>
