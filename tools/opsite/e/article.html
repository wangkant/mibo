<h1>北湖湿地公园完成生态修复</h1>
<p class="hint">记者 方晴 · 2026 年 11 月 18 日</p>
<p>历时两年的北湖湿地公园生态修复工程本周完工。修复后的湿地面积扩大到 320 公顷，比修复前增加了约三分之一。</p>
<p>工程拆除了沿岸的硬质堤岸，改种芦苇和菖蒲，并新建了三处候鸟观测点。园方表示，今冬已有黑脸琵鹭在此停歇。</p>
<p>公园将于 12 月 1 日起全面开放，入园免费，每天开放到晚上九点。</p>
