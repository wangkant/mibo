<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" width="160" height="190">
  <!-- Mibo: a light capsule shell, a dark glass visor with two light eyes. Each part is a group
       of its own, so the pet can move it (pet.js, pet.css); the colours that follow the person's
       choice are written in the defaults and swapped by the server (panels/colors.py). -->
  <defs>
    <linearGradient id="mibo-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfc" /><stop offset=".55" stop-color="#eef1f5" /><stop offset="1" stop-color="#d6dadf" />
    </linearGradient>
    <linearGradient id="mibo-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".07" /><stop offset=".22" stop-color="#000" stop-opacity="0" />
      <stop offset=".78" stop-color="#000" stop-opacity="0" /><stop offset="1" stop-color="#000" stop-opacity=".09" />
    </linearGradient>
    <linearGradient id="mibo-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f5f8" /><stop offset="1" stop-color="#cfd3d9" />
    </linearGradient>
    <linearGradient id="mibo-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30343c" /><stop offset="1" stop-color="#0f1115" />
    </linearGradient>
    <linearGradient id="mibo-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mibo-foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3038" /><stop offset="1" stop-color="#1b1e24" />
    </linearGradient>
    <radialGradient id="mibo-shadow">
      <stop offset="0" stop-color="#000" stop-opacity=".2" /><stop offset=".6" stop-color="#000" stop-opacity=".1" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <ellipse class="shadow" cx="200" cy="452" rx="124" ry="16" fill="url(#mibo-shadow)" />
  <g class="figure" data-rig="mibo">
    <g class="foot left"><rect x="128" y="408" width="60" height="42" rx="19" fill="url(#mibo-foot)" /></g>
    <g class="foot right"><rect x="212" y="408" width="60" height="42" rx="19" fill="url(#mibo-foot)" /></g>
    <g class="body">
      <g class="arm left"><rect x="62" y="296" width="30" height="74" rx="15" fill="url(#mibo-arm)" stroke="#c8ccd2" stroke-width="2" transform="rotate(8 77 300)" /></g>
      <g class="arm right"><rect x="308" y="296" width="30" height="74" rx="15" fill="url(#mibo-arm)" stroke="#c8ccd2" stroke-width="2" transform="rotate(-8 323 300)" /></g>
      <g class="antenna">
        <line x1="200" y1="124" x2="200" y2="88" stroke="#adb2b9" stroke-width="6" stroke-linecap="round" />
        <g class="tip"><circle cx="200" cy="80" r="11" fill="#6cc4f5" /><circle cx="196.5" cy="76.5" r="3.5" fill="#fff" fill-opacity=".55" /></g>
      </g>
      <g class="ear left"><rect x="74" y="212" width="20" height="48" rx="10" fill="#adb2b9" /></g>
      <g class="ear right"><rect x="306" y="212" width="20" height="48" rx="10" fill="#adb2b9" /></g>
      <g class="shell">
        <rect x="88" y="120" width="224" height="304" rx="108" fill="url(#mibo-shell)" stroke="#c8ccd2" stroke-width="2" />
        <rect x="89" y="121" width="222" height="302" rx="107" fill="url(#mibo-side)" />
        <path d="M112 318 Q200 340 288 318" fill="none" stroke="#c8ccd2" stroke-width="2.5" />
      </g>
      <g class="chest"><circle cx="200" cy="362" r="7" fill="#6cc4f5" /></g>
      <g class="visor">
        <rect x="116" y="170" width="168" height="108" rx="54" fill="url(#mibo-glass)" />
        <rect class="gloss" x="126" y="176" width="148" height="46" rx="23" fill="url(#mibo-gloss)" />
        <g class="eyes">
          <g class="eye left"><rect class="e-open" x="151.0" y="204.0" width="22" height="44" rx="11.0" fill="#f3f7fb" stroke="#f3f7fb" stroke-opacity=".16" stroke-width="12" paint-order="stroke" /><rect class="e-shut" x="144.4" y="221.6" width="35.2" height="8.8" rx="4.4" fill="#f3f7fb" display="none" /><path class="e-half" d="M151.0 228 h22 v9.0 a11.0 11.0 0 0 1 -22 0 z" fill="#f3f7fb" display="none" /><path class="e-happy" d="M141 233 Q162 206 183 233" fill="none" stroke="#f3f7fb" stroke-width="12" stroke-linecap="round" display="none" /><path class="e-sleep" d="M143 225 Q162 241 181 225" fill="none" stroke="#f3f7fb" stroke-width="8" stroke-linecap="round" display="none" /><rect class="e-round" x="147" y="200" width="30" height="52" rx="15" fill="#f3f7fb" stroke="#f3f7fb" stroke-opacity=".16" stroke-width="12" paint-order="stroke" display="none" /><path class="e-dizzy" d="M160 226 a4 4 0 0 1 8 0 a8 8 0 0 1 -16 0 a12 12 0 0 1 24 0 a16 16 0 0 1 -32 0 a19 19 0 0 1 38 0" fill="none" stroke="#f3f7fb" stroke-width="6.5" stroke-linecap="round" display="none" /></g>
          <g class="eye right"><rect class="e-open" x="227.0" y="204.0" width="22" height="44" rx="11.0" fill="#f3f7fb" stroke="#f3f7fb" stroke-opacity=".16" stroke-width="12" paint-order="stroke" /><rect class="e-shut" x="220.4" y="221.6" width="35.2" height="8.8" rx="4.4" fill="#f3f7fb" display="none" /><path class="e-half" d="M227.0 228 h22 v9.0 a11.0 11.0 0 0 1 -22 0 z" fill="#f3f7fb" display="none" /><path class="e-happy" d="M217 233 Q238 206 259 233" fill="none" stroke="#f3f7fb" stroke-width="12" stroke-linecap="round" display="none" /><path class="e-sleep" d="M219 225 Q238 241 257 225" fill="none" stroke="#f3f7fb" stroke-width="8" stroke-linecap="round" display="none" /><rect class="e-round" x="223" y="200" width="30" height="52" rx="15" fill="#f3f7fb" stroke="#f3f7fb" stroke-opacity=".16" stroke-width="12" paint-order="stroke" display="none" /><path class="e-dizzy" d="M236 226 a4 4 0 0 1 8 0 a8 8 0 0 1 -16 0 a12 12 0 0 1 24 0 a16 16 0 0 1 -32 0 a19 19 0 0 1 38 0" fill="none" stroke="#f3f7fb" stroke-width="6.5" stroke-linecap="round" display="none" /></g>
        </g>
      </g>
      <!-- What it holds or wears, hidden in the drawing itself (as a picture it holds nothing) and
           shown as it does something (pet.js, pet.css): headphones while it
           is not to disturb; a magnifier held out while it searches, a book while it reads, and
           something found held up over its head, each placed for the arm's pose that holds it. -->
      <g class="prop headphones" display="none">
        <path d="M86 240 C 84 82, 316 82, 314 240" fill="none" stroke="#2c3038" stroke-width="12" stroke-linecap="round" />
        <rect x="64" y="204" width="36" height="64" rx="16" fill="#6cc4f5" stroke="#2c3038" stroke-width="5" />
        <rect x="300" y="204" width="36" height="64" rx="16" fill="#6cc4f5" stroke="#2c3038" stroke-width="5" />
      </g>
      <g class="prop magnifier" display="none">
        <line x1="348" y1="270" x2="382" y2="322" stroke="#2c3038" stroke-width="11" stroke-linecap="round" />
        <circle cx="330" cy="246" r="27" fill="#fbfcfc" fill-opacity=".45" stroke="#adb2b9" stroke-width="8" />
        <path d="M314 238 a18 18 0 0 1 14 -11" fill="none" stroke="#fbfcfc" stroke-width="4" stroke-linecap="round" />
      </g>
      <g class="prop book" display="none">
        <path d="M200 332 L136 322 Q129 321 129 328 L129 385 Q129 391 136 392 L200 402 L264 392 Q271 391 271 385 L271 328 Q271 321 264 322 Z" fill="#6cc4f5" />
        <path d="M200 337 L141 329 L141 383 L200 393 Z" fill="#fbfcfc" />
        <path d="M200 337 L259 329 L259 383 L200 393 Z" fill="#eef1f5" />
        <path d="M152 344 l36 5 M152 356 l36 5 M152 368 l28 4 M212 349 l36 -5 M212 361 l36 -5 M212 373 l26 -4" stroke="#c8ccd2" stroke-width="3" stroke-linecap="round" />
      </g>
      <g class="prop found" display="none">
        <g transform="rotate(-8 350 191)">
          <rect x="318" y="168" width="64" height="46" rx="9" fill="#fbfcfc" stroke="#6cc4f5" stroke-width="5" />
          <path d="M330 184 h38 M330 197 h24" stroke="#adb2b9" stroke-width="4" stroke-linecap="round" />
        </g>
        <path d="M384 152 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#6cc4f5" />
      </g>
      <!-- Tucked at a side of the screen: its hands over the edge, which runs just under its eyes (petedge.js). -->
      <g class="prop grip" display="none">
        <rect x="94" y="246" width="50" height="34" rx="17" fill="url(#mibo-arm)" stroke="#c8ccd2" stroke-width="2" />
        <rect x="256" y="246" width="50" height="34" rx="17" fill="url(#mibo-arm)" stroke="#c8ccd2" stroke-width="2" />
        <path d="M108 252 v10 M120 251 v11 M132 252 v10 M268 252 v10 M280 251 v11 M292 252 v10" stroke="#c8ccd2" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
